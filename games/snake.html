<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Змейка — LEGIT</title>
<style>
:root{
  --g: inset 0 0 0 1px rgba(255,255,255,.03),
       inset 1.8px 3px 0 -2px rgba(255,255,255,.27),
       inset -2px -2px 0 -2px rgba(255,255,255,.24),
       0 6px 16px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,'SF Pro Display',Inter,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

/* bg */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg::before{content:'';position:absolute;inset:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg at 30% 40%,
    rgba(29,78,216,0) 0deg,rgba(37,99,235,.3) 60deg,
    rgba(29,78,216,0) 120deg,rgba(79,70,229,.22) 180deg,
    rgba(37,99,235,0) 240deg,rgba(29,78,216,.18) 300deg,
    rgba(29,78,216,0) 360deg);
  animation:spin 16s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.blob{position:absolute;border-radius:50%;filter:blur(80px);}
.b1{width:60vw;height:60vw;background:rgba(37,99,235,.4);top:-10%;left:-10%;animation:bm1 20s ease-in-out infinite alternate;}
.b2{width:50vw;height:50vw;background:rgba(16,185,129,.25);bottom:-10%;right:-10%;animation:bm2 24s ease-in-out infinite alternate;}
@keyframes bm1{to{transform:translate(10vw,15vh) scale(1.2);}}
@keyframes bm2{to{transform:translate(-8vw,-10vh) scale(.85);}}

/* shell */
.shell{position:relative;z-index:1;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;}

.topbar{width:100%;display:flex;align-items:center;padding:10px 16px;gap:12px;}
.back{font-size:14px;font-weight:700;color:rgba(96,165,250,.9);text-decoration:none;}
.scores{display:flex;gap:10px;flex:1;justify-content:center;}
.chip{background:rgba(255,255,255,.06);border:.5px solid rgba(59,130,246,.25);
  border-radius:12px;padding:6px 16px;text-align:center;box-shadow:var(--g);}
.chip label{display:block;font-size:8px;color:rgba(255,255,255,.4);
  text-transform:uppercase;letter-spacing:1px;}
.chip span{font-size:18px;font-weight:900;color:#60a5fa;}

/* canvas */
#cv{border-radius:14px;border:.5px solid rgba(59,130,246,.3);
  box-shadow:0 0 28px rgba(37,99,235,.25),var(--g);display:block;}

/* dpad */
.dpad{display:grid;
  grid-template-areas:". u ." "l c r" ". d .";
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;padding:12px 16px;width:100%;max-width:360px;}
.dc{height:62px;border-radius:16px;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(59,130,246,.1);border:.5px solid rgba(59,130,246,.25);
  color:#fff;box-shadow:var(--g);transition:transform .1s,background .1s;user-select:none;}
.dc:active,.dc.press{transform:scale(.84);background:rgba(59,130,246,.32);}
.du{grid-area:u;} .dl{grid-area:l;} .dr{grid-area:r;} .dd{grid-area:d;}
.dc.center{grid-area:c;font-size:14px;font-weight:700;color:rgba(255,255,255,.4);}

/* overlay */
.ov{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:rgba(0,0,15,.85);backdrop-filter:blur(12px);}
.ov.hide{display:none;}
.ov h2{font-size:28px;font-weight:900;color:#fff;}
.ov p{font-size:14px;color:rgba(255,255,255,.5);}
.btn-group { display: flex; gap: 12px; margin-top: 10px; }
.btn{padding:14px 32px;border-radius:16px;font-size:16px;font-weight:800;
  color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  box-shadow:0 0 24px rgba(59,130,246,.5);}
.btn:active{transform:scale(.93);}
.btn-exit{padding:14px 32px;border-radius:16px;font-size:16px;font-weight:800;
  color:#fff;border:none;cursor:pointer; text-decoration: none; display: flex; align-items: center; justify-content: center;
  background:rgba(255,255,255,0.1);
  box-shadow:var(--g);}
.btn-exit:active{transform:scale(.93);}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script><style>html,body{background:#0c0d11}.back{color:#9bc8ff}.btn,.btn-start{background:linear-gradient(135deg,#388cf6,#2462ca)!important;color:#fff!important}.ov{background:rgba(12,13,17,.94)!important}.ov h2{color:#edf5ff}.btn-exit,.back{min-height:44px;display:inline-flex;align-items:center;justify-content:center}a:focus-visible,button:focus-visible{outline:3px solid #89baff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.blob{animation:none!important}}</style></head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<div class="shell">
  <div class="topbar">
    <a href="../index.html#games" class="back">← На главную</a>
    <div class="scores">
      <div class="chip"><label>Счет</label><span id="sc">0</span></div>
      <div class="chip"><label>Длина</label><span id="ln">3</span></div>
    </div>
  </div>

  <canvas id="cv"></canvas>

  <div class="dpad">
    <div class="dc du" id="dU">↑</div>
    <div class="dc dl" id="dL">←</div>
    <div class="dc center">D-PAD</div>
    <div class="dc dr" id="dR">→</div>
    <div class="dc dd" id="dD">↓</div>
  </div>
</div>

<div class="ov" id="ovS">
  <h2>🐍 Змейка</h2>
  <p>Собирай еду и не врежься!</p>
  <button class="btn" id="btnS">Начать</button>
</div>
<div class="ov hide" id="ovO">
  <h2>Конец игры!</h2>
  <p id="ot">Счет: 0</p>
  <div class="btn-group">
    <a href="../index.html#games" class="btn-exit">Выйти</a>
    <button class="btn" id="btnR">Еще раз</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// Responsive canvas
const SZ = Math.min(window.innerWidth - 32, window.innerHeight * 0.5, 340);
cv.width = cv.height = SZ;
const GRID = 16;
const CS = SZ / GRID;

// ── state ──────────────────────────────────────────────────
let snake, vx, vy, nvx, nvy, fx, fy, score, running, raf, lastT;
const SPEED = 130;

function init(){
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  vx=1; vy=0; nvx=1; nvy=0;
  score=0; placeFood();
  document.getElementById('sc').textContent=0;
  document.getElementById('ln').textContent=3;
}

function placeFood(){
  do{ fx=Math.floor(Math.random()*GRID); fy=Math.floor(Math.random()*GRID); }
  while(snake.some(s=>s.x===fx&&s.y===fy));
}

// ── draw ───────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='rgba(0,6,18,.95)'; ctx.fillRect(0,0,SZ,SZ);
  ctx.strokeStyle='rgba(59,130,246,.055)'; ctx.lineWidth=.5;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,SZ);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(SZ,i*CS);ctx.stroke();
  }
  ctx.save();
  ctx.shadowColor='#f43f5e'; ctx.shadowBlur=18;
  const fx2=fx*CS+CS/2, fy2=fy*CS+CS/2, fr=CS/2-2;
  ctx.fillStyle='#f43f5e';
  ctx.beginPath(); ctx.arc(fx2,fy2,fr,0,Math.PI*2); ctx.fill();
  ctx.restore();
  snake.forEach((s,i)=>{
    const ratio=1-i/snake.length;
    const alpha=.55+ratio*.45;
    ctx.save();
    if(i===0){ ctx.shadowColor='#60a5fa'; ctx.shadowBlur=14; }
    ctx.fillStyle=i===0
      ? '#60a5fa'
      : `rgba(${37+Math.round(ratio*22)},${99+Math.round(ratio*31)},${235},${alpha})`;
    const pad=i===0?1:2;
    const r=i===0?5:4;
    ctx.beginPath();
    ctx.roundRect(s.x*CS+pad, s.y*CS+pad, CS-pad*2, CS-pad*2, r);
    ctx.fill();
    ctx.restore();
  });
}

// ── loop ───────────────────────────
function step(ts){
  if(!running){return;}
  raf=requestAnimationFrame(step);
  if(ts-lastT < SPEED){draw();return;}
  lastT=ts;

  vx=nvx; vy=nvy;
  const head={x:snake[0].x+vx, y:snake[0].y+vy};
  
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){endGame();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){endGame();return;}

  snake.unshift(head);
  if(head.x===fx&&head.y===fy){
    score+=10; placeFood();
    document.getElementById('sc').textContent=score;
    document.getElementById('ln').textContent=snake.length;
  } else {
    snake.pop();
  }
  draw();
}

function startGame(){
  running=false; cancelAnimationFrame(raf);
  init(); running=true;
  document.getElementById('ovS').classList.add('hide');
  document.getElementById('ovO').classList.add('hide');
  lastT=0; raf=requestAnimationFrame(step);
}
function endGame(){
  running=false; cancelAnimationFrame(raf);
  document.getElementById('ot').textContent='Счет: '+score;
  document.getElementById('ovO').classList.remove('hide');
}

function setDir(dx,dy){
  if(!running)return;
  if(dx!==0&&vx===-dx)return;
  if(dy!==0&&vy===-dy)return;
  nvx=dx; nvy=dy;
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')    setDir(0,-1);
  if(e.key==='ArrowDown')  setDir(0,1);
  if(e.key==='ArrowLeft')  setDir(-1,0);
  if(e.key==='ArrowRight') setDir(1,0);
});

function dBtn(id,dx,dy){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();setDir(dx,dy);},{passive:false});
  el.addEventListener('mousedown',()=>setDir(dx,dy));
}
dBtn('dU',0,-1); dBtn('dD',0,1); dBtn('dL',-1,0); dBtn('dR',1,0);

let sx,sy;
cv.addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20)setDir(1,0); else if(dx<-20)setDir(-1,0);
  } else {
    if(dy>20)setDir(0,1); else if(dy<-20)setDir(0,-1);
  }
},{passive:true});

document.getElementById('btnS').addEventListener('click',startGame);
document.getElementById('btnR').addEventListener('click',startGame);

init(); draw();
</script>
<script>(function(){var app=window.Telegram&&window.Telegram.WebApp;if(!app||!app.initData)return;app.ready();app.expand();if(app.isVersionAtLeast('6.1')){app.setHeaderColor('#0c0d11');app.setBackgroundColor('#0c0d11');app.BackButton.show();app.BackButton.onClick(function(){location.href='../index.html#games';});}})();</script></body>
</html>
